name: CI, CD Build Spring Boot App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Copy Jar
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Copy .env từ host
        run: cp /home/ubuntu/ewallet_project/ewallet_source/.env .env

      - name: Show workspace
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          
      # Cấp quyền thực thi cho file mvn
      - name: Ensure mvnw executable
        run: |
          cd ${{ github.workspace }}
          chmod +x mvnw
           
      # Build NGAY TRONG workspace của runner
      - name: Build with Maven
        working-directory: ${{ github.workspace }}
        run: ./mvnw -B clean package -DskipTests

      - name: List built artifacts
        run: ls -lh ${{ github.workspace }}/target

      # Copy .jar sang chỗ bạn muốn chạy app
      - name: Copy jar to run directory
        run: |
          cp ${{ github.workspace }}/target/*.jar \
             /home/ubuntu/ewallet_project/ewallet_source/ewallet.jar
          chown ubuntu:ubuntu /home/ubuntu/ewallet_project/ewallet_source/ewallet.jar
  deploy:
    name: Deploy Project
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Restart ewallet service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart ewallet
          sudo systemctl status ewallet --no-pager

