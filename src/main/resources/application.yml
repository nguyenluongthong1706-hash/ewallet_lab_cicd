spring:
    application:
        name:
            payment-api
    
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    port: 8080

jwt:
  secret: ${JWT_SECRET:ThisIsADemoSecretKeyForJWT_DoNotUseInProduction123456}
  expiration-ms: 86400000

